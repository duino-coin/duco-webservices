<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Duino-Coin | Password recovery</title>
    <script>
        const walletUrl = new URL("./", window.location.href);
        walletUrl.search = window.location.search;
        walletUrl.hash = window.location.hash;
        window.location.replace(walletUrl.href);
    </script>
</head>
<body>
    <p>Password recovery has moved to the <a href="./">main wallet</a>. Select "Forgot password?" on the login page.</p>
</body>
</html>
